{% comment %}
Banner que aparece cuando la PWA es instalable.
Muestra un boton para instalar la app en el dispositivo.
{% endcomment %}

<div id="pwa-install-banner" class="hidden fixed bottom-4 left-4 right-4 md:left-auto md:right-4 md:max-w-sm z-50 bg-white border-2 border-alsi-200 rounded-xl shadow-pop p-4 animate-fade">
    <div class="flex items-start gap-3">
        <div class="flex-shrink-0 w-12 h-12 bg-gradient-to-br from-alsi-600 to-alsi-800 rounded-xl flex items-center justify-center text-white font-extrabold text-lg">
            A
        </div>
        <div class="flex-1 min-w-0">
            <div class="font-bold text-slate-900 text-sm">Instalar ALSI Balance</div>
            <div class="text-xs text-slate-600 mt-0.5">Accede mas rapido desde tu pantalla de inicio.</div>
            <div class="flex gap-2 mt-3">
                <button type="button" id="pwa-install-btn" class="btn btn-primary text-xs py-1.5 px-3">
                    Instalar
                </button>
                <button type="button" id="pwa-install-dismiss" class="btn btn-ghost text-xs py-1.5 px-3">
                    Ahora no
                </button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    var STORAGE_KEY = 'alsi_pwa_dismissed';
    var DISMISS_DAYS = 1;  // Re-mostrar el banner cada 1 dia
    var banner = document.getElementById('pwa-install-banner');
    var installBtn = document.getElementById('pwa-install-btn');
    var dismissBtn = document.getElementById('pwa-install-dismiss');
    var deferredPrompt = null;

    function isDismissed() {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        try {
            var data = JSON.parse(raw);
            var ageMs = Date.now() - data.ts;
            return ageMs < DISMISS_DAYS * 24 * 60 * 60 * 1000;
        } catch (e) {
            return false;
        }
    }

    function dismiss() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ts: Date.now() }));
        if (banner) banner.classList.add('hidden');
    }

    function show() {
        if (banner && !isDismissed()) {
            banner.classList.remove('hidden');
        }
    }

    // Listener SIEMPRE se registra
    window.addEventListener('beforeinstallprompt', function(e) {
        console.log('[pwa] beforeinstallprompt fired');
        e.preventDefault();
        deferredPrompt = e;
        show();
    });

    window.addEventListener('appinstalled', function() {
        console.log('[pwa] app installed');
        dismiss();
    });

    if (installBtn) {
        installBtn.addEventListener('click', async function() {
            if (!deferredPrompt) {
                console.warn('[pwa] no deferred prompt available');
                // Fallback: mostrar instrucciones manuales
                alert('Tu navegador no soporta instalacion automatica. Usa el menu del navegador:\n\nChrome: Menu > Instalar app\nSafari: Compartir > Añadir a pantalla de inicio');
                return;
            }
            deferredPrompt.prompt();
            try {
                var choice = await deferredPrompt.userChoice;
                console.log('[pwa] user choice:', choice.outcome);
            } catch (e) {
                console.error('[pwa] prompt error:', e);
            }
            deferredPrompt = null;
            if (banner) banner.classList.add('hidden');
        });
    }

    if (dismissBtn) {
        dismissBtn.addEventListener('click', dismiss);
    }

    // Exponer funcion global para que se pueda probar desde consola
    window.alsiPWA = {
        reset: function() {
            localStorage.removeItem(STORAGE_KEY);
            console.log('[pwa] localStorage limpiado, recargando...');
            location.reload();
        },
        checkSW: async function() {
            if (!navigator.serviceWorker) {
                console.log('[pwa] serviceWorker no soportado');
                return;
            }
            var reg = await navigator.serviceWorker.getRegistration();
            console.log('[pwa] SW registrado:', !!reg, reg && reg.scope);
        }
    };
})();
</script>
